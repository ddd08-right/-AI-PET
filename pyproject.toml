[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-ai-reproducibility"
version = "0.1.0"
description = "Synthetic-testable PET/CT AI reproducibility utilities for manifest QC, split leakage checks, segmentation metrics, and run provenance."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "nibabel>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "ruff==0.16.7",
]
pytorch = [
  "torch==2.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "pytorch: tests requiring the optional native PyTorch dependency",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["pet_ai"]
